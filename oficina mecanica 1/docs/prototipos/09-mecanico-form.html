<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar mecânico | Oficina Mecânica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Protótipo de tela (HTML estático) do Sistema de Gestão de Oficina Mecânica -->
<header class="topo">
    <div class="topo-conteudo">
        <a class="marca" href="01-painel.html">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#f2b705" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3 17.7 6.3 21l6.3-6.3a4 4 0 0 0 5.1-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>
            </svg>
            Oficina Mecânica
        </a>
        <nav class="menu" aria-label="Menu principal">
            <a href="01-painel.html">Painel</a>
            <a href="02-ordens-lista.html">Ordens de serviço</a>
            <a href="04-clientes-lista.html">Clientes</a>
            <a href="06-veiculos-lista.html">Veículos</a>
            <a href="08-mecanicos-lista.html" class="ativo">Mecânicos</a>
            <a href="10-servicos-lista.html">Serviços</a>
        </nav>
    </div>
</header>
<main>
    <div class="cabecalho-pagina">
        <h1>Editar mecânico</h1>
    </div>

    <div>
    
    
</div>

    <form class="painel" method="get" action="08-mecanicos-lista.html">
        <input type="hidden" id="id" name="id" value="1">
        <div class="grade">
            <div class="campo inteiro">
                <label for="nome">Nome <span class="obrigatorio">*</span></label>
                <input required minlength="3" maxlength="100" id="nome" name="nome" value="Pedro Santos">
            </div>
            <div class="campo">
                <label for="cpf">CPF <span class="obrigatorio">*</span></label>
                <input required maxlength="14" placeholder="000.000.000-00" id="cpf" name="cpf" value="222.333.444-55">
            </div>
            <div class="campo">
                <label for="telefone">Telefone</label>
                <input maxlength="20" placeholder="(47) 99999-0000" id="telefone" name="telefone" value="(47) 96666-4444">
            </div>
            <div class="campo inteiro">
                <label for="especialidade">Especialidade</label>
                <input maxlength="50" placeholder="Ex.: Motor, Suspensão e freios" id="especialidade" name="especialidade" value="Motor">
            </div>
        </div>
        <div class="acoes-formulario">
            <a class="botao" href="08-mecanicos-lista.html">Cancelar</a>
            <button type="submit" class="botao primario">Salvar mecânico</button>
        </div>
    </form>
</main>
<footer>
    Sistema de Gestão de Oficina Mecânica, feito com Spring MVC, Thymeleaf e Spring Data JPA
</footer>
</body>
</html>
