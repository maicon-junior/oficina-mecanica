<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar veículo | Oficina Mecânica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Protótipo de tela (HTML estático) do Sistema de Gestão de Oficina Mecânica -->
<header class="topo">
    <div class="topo-conteudo">
        <a class="marca" href="01-painel.html">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#f2b705" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3 17.7 6.3 21l6.3-6.3a4 4 0 0 0 5.1-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>
            </svg>
            Oficina Mecânica
        </a>
        <nav class="menu" aria-label="Menu principal">
            <a href="01-painel.html">Painel</a>
            <a href="02-ordens-lista.html">Ordens de serviço</a>
            <a href="04-clientes-lista.html">Clientes</a>
            <a href="06-veiculos-lista.html" class="ativo">Veículos</a>
            <a href="08-mecanicos-lista.html">Mecânicos</a>
            <a href="10-servicos-lista.html">Serviços</a>
        </nav>
    </div>
</header>
<main>
    <div class="cabecalho-pagina">
        <h1>Editar veículo</h1>
    </div>

    <div>
    
    
</div>

    <form class="painel" method="get" action="06-veiculos-lista.html">
        <input type="hidden" id="id" name="id" value="1">
        <div class="grade">
            <div class="campo">
                <label for="placa">Placa <span class="obrigatorio">*</span></label>
                <input required maxlength="8" placeholder="ABC1D23" id="placa" name="placa" value="ABC1D23">
                <span class="ajuda">Padrão antigo ou Mercosul, com 7 caracteres.</span>
            </div>
            <div class="campo">
                <label for="cliente">Cliente (dono) <span class="obrigatorio">*</span></label>
                <select id="cliente" name="cliente.id" required>
                    <option value="">Selecione o cliente</option>
                    <option value="3">Carlos Souza (111.222.333-44)</option>
                    <option value="1" selected="selected">João da Silva (123.456.789-00)</option>
                    <option value="2">Maria Oliveira (987.654.321-00)</option>
                </select>
            </div>
            <div class="campo">
                <label for="marca">Marca <span class="obrigatorio">*</span></label>
                <input required maxlength="50" id="marca" name="marca" value="Volkswagen">
            </div>
            <div class="campo">
                <label for="modelo">Modelo <span class="obrigatorio">*</span></label>
                <input required maxlength="50" id="modelo" name="modelo" value="Gol">
            </div>
            <div class="campo">
                <label for="ano">Ano <span class="obrigatorio">*</span></label>
                <input type="number" required min="1900" id="ano" name="ano" value="2015">
            </div>
            <div class="campo">
                <label for="cor">Cor</label>
                <input maxlength="30" id="cor" name="cor" value="Prata">
            </div>
        </div>
        <div class="acoes-formulario">
            <a class="botao" href="06-veiculos-lista.html">Cancelar</a>
            <button type="submit" class="botao primario">Salvar veículo</button>
        </div>
    </form>
</main>
<footer>
    Sistema de Gestão de Oficina Mecânica, feito com Spring MVC, Thymeleaf e Spring Data JPA
</footer>
</body>
</html>
