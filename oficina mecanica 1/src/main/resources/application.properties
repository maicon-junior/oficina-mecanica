spring.application.name=oficina

# Banco de dados relacional H2 (em memória). Console: http://localhost:8080/h2-console
spring.datasource.url=jdbc:h2:mem:oficina
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# O Hibernate cria as tabelas a partir das entidades e depois o data.sql insere os dados de exemplo
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=true
