<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Veículos')}"></head>
<body>
<header th:replace="~{fragments/layout :: topo('veiculos')}"></header>
<main>
    <div class="cabecalho-pagina">
        <div>
            <h1>Veículos</h1>
            <p class="subtitulo">Cada veículo pertence a um cliente</p>
        </div>
        <a class="botao primario" th:href="@{/veiculos/novo}">Cadastrar veículo</a>
    </div>

    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <section class="painel">
        <form class="pesquisa" method="get" th:action="@{/veiculos}">
            <div class="campo">
                <label for="busca">Pesquisar por placa, modelo ou cliente</label>
                <input id="busca" name="busca" type="search" th:value="${busca}" placeholder="Ex.: ABC1D23">
            </div>
            <button type="submit" class="botao">Pesquisar</button>
        </form>

        <div class="tabela-rolagem">
            <table>
                <thead>
                <tr>
                    <th>Placa</th>
                    <th>Marca / modelo</th>
                    <th>Ano</th>
                    <th>Cor</th>
                    <th>Cliente</th>
                    <th><span class="sr-only">Ações</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="veiculo : ${lista}">
                    <td><span th:replace="~{fragments/layout :: placa(${veiculo.placa})}"></span></td>
                    <td th:text="${veiculo.marca} + ' ' + ${veiculo.modelo}">Volkswagen Gol</td>
                    <td th:text="${veiculo.ano}">2015</td>
                    <td th:text="${veiculo.cor}">Prata</td>
                    <td th:text="${veiculo.cliente.nome}">João da Silva</td>
                    <td class="acoes-linha">
                        <a class="botao pequeno" th:href="@{/veiculos/{id}/editar(id=${veiculo.id})}">Editar</a>
                        <a class="botao pequeno" th:href="@{/veiculos/{id}/excluir(id=${veiculo.id})}">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(lista)}">
                    <td colspan="6" class="vazio">Nenhum veículo encontrado. Confira a pesquisa ou cadastre um novo veículo.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
